<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>HomeSync – Profile</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        nav { background: #1a1a2e; padding: 14px 28px;
              display: flex; align-items: center; justify-content: space-between; }
        nav a { color: #bbb; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { color: white; }
        .container { max-width: 600px; margin: 32px auto; padding: 0 20px; }
        h2 { color: #1a1a2e; margin-bottom: 20px; }
        .card { background: white; border-radius: 8px; padding: 28px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600;
                color: #555; margin-bottom: 5px; }
        input { width: 100%; padding: 9px 12px; border: 1px solid #ddd;
                border-radius: 5px; font-size: 14px; }
        .btn { padding: 10px 22px; background: #3498db; color: white;
               border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .alert { padding: 12px 16px; border-radius: 5px; margin-bottom: 16px; font-size: 14px; }
        .alert-success { background: #d4edda; color: #155724; }
        .info-row { display: flex; margin-bottom: 12px; }
        .info-label { width: 120px; font-weight: 600; color: #555; font-size: 14px; }
        .info-value { color: #333; font-size: 14px; }
    </style>
</head>
<body>
<nav>
    <span style="font-weight:bold; font-size:18px; color:white;">HomeSync</span>
    <div>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/devices}">Devices</a>
        <a th:href="@{/security}">Security</a>
        <a th:href="@{/schedules}">Schedules</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container">
    <h2>My Profile</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card">
        <div class="info-row">
            <span class="info-label">Username:</span>
            <span class="info-value" th:text="${user?.username}">username</span>
        </div>
        <div class="info-row">
            <span class="info-label">Full Name:</span>
            <span class="info-value" th:text="${user?.fullName}">Name</span>
        </div>
        <div class="info-row" style="margin-bottom:24px;">
            <span class="info-label">Role:</span>
            <span class="info-value" th:text="${user?.role}">ROLE</span>
        </div>

        <hr style="margin-bottom:24px; border:none; border-top:1px solid #eee;"/>

        <h3 style="margin-bottom:16px; color:#1a1a2e;">Update Profile</h3>
        <form method="post" th:action="@{/profile/update}">
            <div class="form-group">
                <label>New Email</label>
                <input type="email" name="newEmail"
                       th:placeholder="${user?.email}" placeholder="Leave blank to keep current"/>
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" name="newPassword"
                       placeholder="Leave blank to keep current"/>
            </div>
            <button type="submit" class="btn">Update</button>
        </form>
    </div>
</div>
</body>
</html>
