<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>HomeSync – Admin: Users</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        nav { background: #1a1a2e; padding: 14px 28px;
              display: flex; align-items: center; justify-content: space-between; }
        nav a { color: #bbb; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { color: white; }
        .container { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
        h2 { color: #1a1a2e; margin-bottom: 20px; }
        .card { background: white; border-radius: 8px; padding: 24px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 11px 14px; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f8f9fa; font-weight: 600; }
        .btn { padding: 6px 13px; border: none; border-radius: 4px;
               cursor: pointer; font-size: 13px; }
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #27ae60; color: white; }
        select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; }
        .alert { padding: 12px 16px; border-radius: 5px; margin-bottom: 16px; font-size: 14px; }
        .alert-success { background: #d4edda; color: #155724; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-admin    { background: #e8f0fe; color: #1a56db; }
        .badge-resident { background: #def7ec; color: #057a55; }
    </style>
</head>
<body>
<nav>
    <span style="font-weight:bold; font-size:18px; color:white;">HomeSync</span>
    <div>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/devices}">Devices</a>
        <a th:href="@{/security}">Security</a>
        <a th:href="@{/schedules}">Schedules</a>
        <a th:href="@{/admin/users}">Admin</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container">
    <h2>User Management (Admin)</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Status</th>
                    <th>Change Role</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}">1</td>
                    <td th:text="${u.username}">username</td>
                    <td th:text="${u.fullName}">Name</td>
                    <td th:text="${u.email}">email</td>
                    <td>
                        <span th:class="'badge ' + (${u.role.name() == 'ADMIN'} ? 'badge-admin' : 'badge-resident')"
                              th:text="${u.role}">ROLE</span>
                    </td>
                    <td th:text="${u.active ? 'Active' : 'Inactive'}">Active</td>
                    <td>
                        <form method="post"
                              th:action="@{/admin/users/{id}/role(id=${u.id})}"
                              style="display:flex; gap:6px; align-items:center;">
                            <select name="role">
                                <option th:each="r : ${T(com.homesync.model.User.Role).values()}"
                                        th:value="${r}" th:text="${r}"
                                        th:selected="${r == u.role}"></option>
                            </select>
                            <button type="submit" class="btn btn-primary">Update</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
