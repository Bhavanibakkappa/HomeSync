<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>HomeSync</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; color: #333; }
        nav { background: #1a1a2e; color: white; padding: 12px 24px;
              display: flex; align-items: center; justify-content: space-between; }
        nav a { color: #ccc; text-decoration: none; margin-right: 20px; }
        nav a:hover { color: white; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; border-radius: 8px; padding: 24px;
                box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .btn { padding: 8px 16px; border: none; border-radius: 5px;
               cursor: pointer; font-size: 14px; }
        .btn-primary { background: #3498db; color: white; }
        .btn-danger  { background: #e74c3c; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-secondary { background: #7f8c8d; color: white; }
        .alert { padding: 12px 16px; border-radius: 5px; margin-bottom: 16px; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-danger  { background: #f8d7da; color: #721c24; }
        .alert-warning { background: #fff3cd; color: #856404; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 14px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #f8f9fa; font-weight: 600; }
        input, select { width: 100%; padding: 8px 12px; border: 1px solid #ddd;
                        border-radius: 5px; font-size: 14px; margin-top: 4px; }
        label { font-size: 13px; font-weight: 600; color: #555; }
        .form-group { margin-bottom: 16px; }
        h2 { margin-bottom: 20px; color: #1a1a2e; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge-on      { background: #d4edda; color: #155724; }
        .badge-off     { background: #e2e3e5; color: #383d41; }
        .badge-armed   { background: #fff3cd; color: #856404; }
        .badge-alarm   { background: #f8d7da; color: #721c24; }
        .badge-disarmed{ background: #d4edda; color: #155724; }
    </style>
</head>
<body>

<nav th:fragment="navbar">
    <span style="font-weight:bold; font-size:18px;">HomeSync</span>
    <div>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/devices}">Devices</a>
        <a th:href="@{/security}">Security</a>
        <a th:href="@{/schedules}">Schedules</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Admin</a>
        <a th:href="@{/profile}">Profile</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>

</body>
</html>
