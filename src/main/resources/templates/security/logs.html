<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <title>HomeSync – Security Logs</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; }
        nav { background: #1a1a2e; color: white; padding: 14px 28px;
              display: flex; align-items: center; justify-content: space-between; }
        nav a { color: #bbb; text-decoration: none; margin-left: 20px; font-size: 14px; }
        nav a:hover { color: white; }
        .container { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
        h2 { color: #1a1a2e; margin-bottom: 24px; }
        .alert { padding: 12px 16px; border-radius: 5px; margin-bottom: 16px; font-size: 14px; }
        .alert-success { background: #d4edda; color: #155724; }
        .count-info { font-size: 13px; color: #777; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; background: white;
                border-radius: 8px; overflow: hidden;
                box-shadow: 0 1px 5px rgba(0,0,0,0.08); }
        thead { background: #1a1a2e; color: white; }
        th, td { padding: 12px 16px; text-align: left; font-size: 14px; }
        tr:nth-child(even) td { background: #f9f9f9; }
        .badge { display: inline-block; padding: 3px 10px; border-radius: 12px;
                 font-size: 12px; font-weight: 600; }
        .badge-DISARMED           { background: #d4edda; color: #155724; }
        .badge-ARMED              { background: #fff3cd; color: #856404; }
        .badge-INTRUSION_DETECTED { background: #f8d7da; color: #721c24; }
        .badge-ALARM_ACTIVE       { background: #f5c6cb; color: #491217; }
        .badge-ALERT_SENT         { background: #e2d9f3; color: #4a235a; }
        .badge-RESET              { background: #d4edda; color: #155724; }
        .btn { padding: 7px 14px; border-radius: 5px; border: none;
               cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }
        .btn-back { display: inline-block; margin-top: 20px; padding: 9px 18px;
                    background: #1a1a2e; color: white; border-radius: 5px;
                    text-decoration: none; font-size: 13px; }
        .btn-back:hover { background: #2d2d44; }
        .empty { text-align: center; color: #999; padding: 24px; font-size: 14px; }
    </style>
</head>
<body>

<nav>
    <span style="font-weight:bold; font-size:18px;">HomeSync</span>
    <div>
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/devices}">Devices</a>
        <a th:href="@{/security}">Security</a>
        <a th:href="@{/schedules}">Schedules</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Admin</a>
        <a th:href="@{/profile}">Profile</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>

<div class="container">
    <h2>📋 All Security Logs</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <!--
        Every row in this table was saved by LoggingAlertObserver.onAlert()
        AND ExternalServiceAlertObserver also fired for INTRUSION/ALARM events.
        SecurityService never knew which observers were running — DIP in action.
    -->
    <p class="count-info"
       th:text="${logs != null} ? ${logs.size()} + ' total event(s) recorded' : '0 events'">
        0 events
    </p>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>State</th>
                <th>Description</th>
                <th>Triggered By</th>
                <th>Timestamp</th>
                <th sec:authorize="hasRole('ADMIN')">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="log : ${logs}">
                <td th:text="${log.id}">1</td>
                <td>
                    <span class="badge"
                          th:classappend="'badge-' + ${log.state}"
                          th:text="${log.state}">ARMED</span>
                </td>
                <td th:text="${log.description}">Motion detected</td>
                <td th:text="${log.triggeredBy != null} ? ${log.triggeredBy.username} : 'System'">
                    System
                </td>
                <td th:text="${#temporals.format(log.timestamp, 'dd-MM-yyyy HH:mm:ss')}">
                    01-01-2024 12:00:00
                </td>
                <td sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/security/delete/{id}(id=${log.id})}" method="post">
                        <button type="submit" class="btn btn-danger"
                                onclick="return confirm('Delete this log entry?')">Delete</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(logs)}">
                <td colspan="6" class="empty">No security events recorded yet.</td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/security}" class="btn-back">← Back to Security Dashboard</a>
</div>

</body>
</html>
